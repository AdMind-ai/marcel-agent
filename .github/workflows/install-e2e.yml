name: Install & Update E2E

# Can a user on a released version get to this commit?
#
# For each release we sample, a leg installs that release through the real
# `curl | install.sh` one-liner (uv, a managed Python, Node, the venv) inside
# scripts/dev-sandbox.sh, then applies one update route and requires the
# checkout to land on this commit with a working `marcel`.
#
# The starting versions are chosen at runtime from the repo's release tags
# (scripts/sandbox/pick-release-tags.sh): newest, oldest, and a spread between.
# A hardcoded list would stop covering the newest release the day after it
# ships, and would pin an "oldest" that nobody still runs.
#
# Triggers:
#   * every 12 hours, so upstream drift (a new uv, a Node bump, a PyPI change)
#     surfaces on a schedule rather than in someone's review cycle;
#   * when a release tag is created -- the moment the set of versions users can
#     update FROM changes, and the moment a broken updater would strand them;
#   * manually, where you can pick the route and how many releases to sample.
#
# Deliberately NOT on pull_request: a leg takes ~11 minutes of real toolchain
# installation, and the matrix multiplies that. Updating is release-shaped work,
# so it is gated on releases and the clock instead.

on:
  workflow_dispatch:
    inputs:
      route:
        description: 'Which update route to exercise.'
        required: false
        type: choice
        default: both
        options: [both, update, installer]
      tag-count:
        description: 'How many release tags to sample (newest, oldest, and a spread between).'
        required: false
        type: string
        default: '5'
      candidate-ref:
        description: 'Candidate branch, tag, or full SHA to clean-install (default: main).'
        required: false
        type: string
        default: main
      candidate-platform:
        description: 'Platform for candidate clean-install qualification.'
        required: false
        type: choice
        default: all
        options: [all, linux, macos, windows]
  schedule:
    # Every 12 hours, off the hour to avoid the top-of-hour runner crunch.
    - cron: '20 7,19 * * *'
  push:
    tags:
      # Release tags only: the repo also carries backup/* and one-off tags.
      - 'v*.*.*'
      - 'v*.*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: read

concurrency:
  group: install-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which released versions do we test updating FROM? Resolved once and shared
  # by both route matrices, so the two routes cover the same set.
  pick-releases:
    name: Pick release tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.pick.outputs.tags }}
      has-releases: ${{ steps.pick.outputs.has-releases }}
    steps:
      # This job only reads tag names and runs one script, so take the cheap
      # checkout: no blobs (filter), no other files (sparse), but DO fetch tags
      # -- they are the whole input, and the default shallow checkout has none.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          filter: blob:none
          fetch-tags: true
          sparse-checkout: scripts/sandbox/pick-release-tags.sh
          sparse-checkout-cone-mode: false
      - id: pick
        env:
          CANDIDATE_REF: ${{ inputs.candidate-ref }}
        run: |
          set -euo pipefail
          if ! git tag --list 'v*' | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "No Marcel release tags exist yet; update E2E will start after the first prerelease."
            echo 'tags=[]' >> "$GITHUB_OUTPUT"
            echo 'has-releases=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          picker_args=(--count '${{ inputs.tag-count || 5 }}')
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            picker_args+=(--exclude-tag "$GITHUB_REF_NAME")
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] &&
            git show-ref --verify --quiet "refs/tags/$CANDIDATE_REF"; then
            picker_args+=(--exclude-tag "$CANDIDATE_REF")
          fi
          tags="$(scripts/sandbox/pick-release-tags.sh "${picker_args[@]}")"
          echo "Testing updates from: $tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          if [[ "$tags" == "[]" ]]; then
            echo "No prior Marcel release tags exist; historical update E2E is not applicable."
            echo 'has-releases=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'has-releases=true' >> "$GITHUB_OUTPUT"

  # `marcel update` -- the route most users take.
  update:
    if: needs.pick-releases.outputs.has-releases == 'true' && (github.event_name != 'workflow_dispatch' || inputs.route != 'installer')
    needs: pick-releases
    strategy:
      # One release breaking is worth knowing about even if another already
      # failed, so let every leg report.
      fail-fast: false
      matrix:
        install-ref: ${{ fromJSON(needs.pick-releases.outputs.tags) }}
    uses: ./.github/workflows/install-e2e-run.yml
    with:
      route: update
      install-ref: ${{ matrix.install-ref }}
      target-sha: ${{ github.sha }}

  # Re-running the curl one-liner over an existing checkout: autostash + pull
  # rather than the updater's own git handling.
  installer:
    if: needs.pick-releases.outputs.has-releases == 'true' && (github.event_name != 'workflow_dispatch' || inputs.route != 'update')
    needs: pick-releases
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        install-ref: ${{ fromJSON(needs.pick-releases.outputs.tags) }}
    uses: ./.github/workflows/install-e2e-run.yml
    with:
      route: installer
      install-ref: ${{ matrix.install-ref }}
      target-sha: ${{ github.sha }}

  # A candidate is deliberately separate from the historical update matrix:
  # arbitrary candidate code is run with read-only contents access and no
  # secrets, and never through the reusable update workflow.
  candidate-resolve:
    if: github.event_name == 'workflow_dispatch'
    name: Resolve candidate commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Validate candidate ref
        env:
          CANDIDATE_REF: ${{ inputs.candidate-ref }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REF" != -* && "$CANDIDATE_REF" != *..* && "$CANDIDATE_REF" != *:* ]]
          [[ "$CANDIDATE_REF" != refs/* ]] || {
            echo "Use a branch/tag name or full SHA from this repository; fork and pull refs are not accepted." >&2
            exit 1
          }
          [[ "$CANDIDATE_REF" =~ ^[A-Za-z0-9._/-]+$ ]]
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.candidate-ref }}
          fetch-depth: 1
          persist-credentials: false
      - id: resolve
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Candidate resolved to repository commit $sha"

  candidate:
    if: github.event_name == 'workflow_dispatch'
    name: Candidate clean install (${{ matrix.platform }})
    needs: candidate-resolve
    strategy:
      fail-fast: false
      matrix:
        include: ${{ inputs.candidate-platform == 'all' && fromJSON('[{"platform":"linux","runner":"ubuntu-latest"},{"platform":"macos","runner":"macos-latest"},{"platform":"windows","runner":"windows-latest"}]') || inputs.candidate-platform == 'linux' && fromJSON('[{"platform":"linux","runner":"ubuntu-latest"}]') || inputs.candidate-platform == 'macos' && fromJSON('[{"platform":"macos","runner":"macos-latest"}]') || fromJSON('[{"platform":"windows","runner":"windows-latest"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.candidate-resolve.outputs.sha }}
          path: .qualification-candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Capture trusted Python (Unix)
        if: matrix.platform != 'windows'
        id: trusted-python-unix
        run: |
          set -euo pipefail
          printf 'path=%s\n' "$(python3 -c 'import sys; print(sys.executable)')" >> "$GITHUB_OUTPUT"
      - name: Capture trusted Python (Windows)
        if: matrix.platform == 'windows'
        id: trusted-python-windows
        shell: pwsh
        run: |
          $python = Get-Command python -CommandType Application |
            Select-Object -First 1 -ExpandProperty Source
          if ([string]::IsNullOrWhiteSpace($python) -or
              [IO.Path]::GetExtension($python) -ne ".exe" -or
              -not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw "Trusted Python must be one existing .exe path: $python"
          }
          "path=$python" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Candidate clean install (Unix)
        if: matrix.platform != 'windows'
        env:
          CANDIDATE_SHA: ${{ needs.candidate-resolve.outputs.sha }}
          CANDIDATE_DIR: ${{ github.workspace }}/.qualification-candidate
          MARCEL_HOME: ${{ runner.temp }}/marcel-candidate-home
          INSTALL_DIR: ${{ runner.temp }}/marcel-candidate-install
          TRUSTED_PYTHON: ${{ steps.trusted-python-unix.outputs.path }}
        run: |
          set -euo pipefail
          cd "$CANDIDATE_DIR"
          bash ./scripts/install.sh --commit "$CANDIDATE_SHA" --non-interactive \
            --skip-browser --skip-setup --marcel-home "$MARCEL_HOME" --dir "$INSTALL_DIR"
          test "$(git -C "$INSTALL_DIR" rev-parse HEAD)" = "$CANDIDATE_SHA"
          export PATH="$INSTALL_DIR/venv/bin:$HOME/.local/bin:$PATH"
          marcel --version
          set +e
          NO_COLOR=1 marcel doctor >"$RUNNER_TEMP/marcel-doctor.txt" 2>&1
          doctor_status=$?
          set -e
          printf '%s\n' "$doctor_status" >"$RUNNER_TEMP/marcel-doctor.status"
      - name: Candidate clean install (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ needs.candidate-resolve.outputs.sha }}
          CANDIDATE_DIR: ${{ github.workspace }}\.qualification-candidate
          MARCEL_HOME: ${{ runner.temp }}\marcel-candidate-home
          INSTALL_DIR: ${{ runner.temp }}\marcel-candidate-install
          TRUSTED_PYTHON: ${{ steps.trusted-python-windows.outputs.path }}
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location $env:CANDIDATE_DIR
          & .\scripts\install.ps1 -Commit $env:CANDIDATE_SHA -NonInteractive `
            -SkipSetup -MarcelHome $env:MARCEL_HOME -InstallDir $env:INSTALL_DIR
          Pop-Location
          $installed = (git -C $env:INSTALL_DIR rev-parse HEAD).Trim()
          if ($installed -ne $env:CANDIDATE_SHA) { throw "Installer resolved $installed, expected $env:CANDIDATE_SHA" }
          $env:PATH = "$env:INSTALL_DIR\venv\Scripts;$env:USERPROFILE\.local\bin;$env:PATH"
          marcel --version
          $doctorLog = Join-Path $env:RUNNER_TEMP "marcel-doctor.txt"
          $doctorExit = $null
          $doctorInvocationError = $null
          $env:NO_COLOR = "1"
          try {
            & marcel doctor *> $doctorLog
            $doctorExit = $LASTEXITCODE
          } catch {
            $doctorExit = if ($LASTEXITCODE -is [int]) { $LASTEXITCODE } else { 1 }
          }
          if ($null -eq $doctorExit) { throw "marcel doctor did not provide an exit code" }
          "$doctorExit" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "marcel-doctor.status") -Encoding ascii
      # This checkout happens only after candidate code has finished. The
      # candidate lives in a sibling path, so neither checkout can remove the
      # other, and candidate code cannot replace the validator before use.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          path: .qualification-trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Validate candidate doctor output (Unix)
        if: matrix.platform != 'windows'
        env:
          TRUSTED_PYTHON: ${{ steps.trusted-python-unix.outputs.path }}
        run: |
          set -euo pipefail
          "$TRUSTED_PYTHON" "$GITHUB_WORKSPACE/.qualification-trusted/.github/scripts/validate-doctor.py" \
            "$RUNNER_TEMP/marcel-doctor.txt" "$(cat "$RUNNER_TEMP/marcel-doctor.status")"
      - name: Validate candidate doctor output (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TRUSTED_PYTHON: ${{ steps.trusted-python-windows.outputs.path }}
        run: |
          $ErrorActionPreference = "Stop"
          $trustedValidator = Join-Path $env:GITHUB_WORKSPACE ".qualification-trusted\.github\scripts\validate-doctor.py"
          $status = (Get-Content (Join-Path $env:RUNNER_TEMP "marcel-doctor.status") -Raw).Trim()
          & $env:TRUSTED_PYTHON $trustedValidator (Join-Path $env:RUNNER_TEMP "marcel-doctor.txt") $status
