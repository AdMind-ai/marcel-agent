name: Install & Update E2E (reusable)

# Runs ONE update or rollback route against ONE starting commit, in the dev sandbox, with a
# real install (uv, a managed Python, Node, the venv) behind it.
#
# Reusable so callers can fan out over the combinations that matter -- update
# from the tip vs. from an older release, `marcel update` vs. re-running the
# installer, and returning to the historical commit -- without duplicating the
# runner setup. Each leg is independent:
# its own sandbox, its own install, nothing rewound or shared.
#
# Call it:
#
#   jobs:
#     tip:
#       uses: ./.github/workflows/install-e2e-run.yml
#       with:
#         route: update
#         install-ref: refs/heads/main
#         target-sha: 0123456789abcdef0123456789abcdef01234567

on:
  workflow_call:
    inputs:
      route:
        description: 'Path to exercise: update, installer, or rollback (update then return to the starting commit).'
        required: true
        type: string
      install-ref:
        description: 'What to install before updating: a branch, a tag (v2026.7.7), or a SHA reachable from main.'
        required: false
        type: string
        default: refs/heads/main
      base-sha:
        description: 'Expected immutable SHA after the initial install (used by rollback qualification).'
        required: false
        type: string
        default: ''
      target-sha:
        description: 'Explicit immutable candidate update target SHA.'
        required: true
        type: string
      runner:
        description: 'Runner label.'
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: 'Job timeout. A cold run installs real toolchains twice.'
        required: false
        type: number
        default: 45

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ inputs.route }} from ${{ inputs.install-ref }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      # This checkout owns the harness and every verifier/assertion. It must
      # not be replaced by candidate source.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          path: .qualification-trusted
          fetch-depth: 0
          persist-credentials: false

      # The candidate is deliberately a sibling checkout. The trusted harness
      # points the sandbox source root at this path explicitly.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.target-sha }}
          path: .qualification-candidate
          fetch-depth: 0
          persist-credentials: false

      # bubblewrap + slirp4netns are what the sandbox is built on; util-linux
      # supplies the `unshare` that builds the multi-uid userns for the
      # user-level (non-root) install.
      - name: Install sandbox dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap slirp4netns uidmap util-linux

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
      # which is exactly what bwrap needs. Report the state before touching it
      # so a future runner-image change is visible in the log rather than
      # silently altering what this job proves.
      - name: Permit unprivileged user namespaces
        run: |
          set -euo pipefail
          echo "--- kernel userns settings (before)"
          sysctl kernel.unprivileged_userns_clone 2>/dev/null || echo "  (sysctl absent)"
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo "  (sysctl absent)"
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "--- subuid/subgid for $(id -un)"
          grep "^$(id -un):" /etc/subuid /etc/subgid || echo "  (none — sandbox will say so)"

      - name: Run install + update E2E
        env:
          E2E_ROUTE: ${{ inputs.route }}
          E2E_INSTALL_REF: ${{ inputs.install-ref }}
          E2E_BASE_SHA: ${{ inputs.base-sha }}
          E2E_TARGET_SHA: ${{ inputs.target-sha }}
          MARCEL_E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
          TRUSTED_ROOT: ${{ github.workspace }}/.qualification-trusted
          CANDIDATE_ROOT: ${{ github.workspace }}/.qualification-candidate
        run: |
          set -euo pipefail
          case "$E2E_ROUTE" in
            update|installer|rollback) ;;
            *) echo "unsupported E2E route: $E2E_ROUTE" >&2; exit 1 ;;
          esac
          [[ -z "$E2E_BASE_SHA" || "$E2E_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "$E2E_TARGET_SHA" || "$E2E_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          args=(--route "$E2E_ROUTE" --install-ref "$E2E_INSTALL_REF")
          [ -z "$E2E_BASE_SHA" ] || args+=(--base-sha "$E2E_BASE_SHA")
          [ -z "$E2E_TARGET_SHA" ] || args+=(--target-sha "$E2E_TARGET_SHA")
          cd "$TRUSTED_ROOT"
          MARCEL_E2E_TRUSTED_ROOT="$TRUSTED_ROOT" \
            MARCEL_E2E_CANDIDATE_ROOT="$CANDIDATE_ROOT" \
            tests/install/install-update-e2e.sh "${args[@]}"

      # Artifact names cannot contain '/', and install-ref may be a full ref
      # like refs/heads/main. GitHub Actions expressions have no string-replace
      # function, so build the safe name here. Runs even on failure -- that is
      # exactly when the logs are wanted.
      - name: Build artifact name
        if: always()
        id: artifact
        env:
          E2E_ROUTE: ${{ inputs.route }}
          E2E_INSTALL_REF: ${{ inputs.install-ref }}
        run: |
          set -euo pipefail
          safe_ref="$E2E_INSTALL_REF"
          safe_ref="${safe_ref//\//-}"
          safe_ref="${safe_ref//[^A-Za-z0-9_.-]/-}"
          echo "name=install-e2e-${E2E_ROUTE}-${safe_ref}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      # The installer's own transcripts say far more than the assertion that
      # tripped when a real install breaks.
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Unique per leg: a matrix over releases runs this workflow several
          # times per route, and same-named artifacts collide.
          name: ${{ steps.artifact.outputs.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 14
          if-no-files-found: ignore
