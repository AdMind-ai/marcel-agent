name: Label rerun

# When the ``ci-reviewed`` label is added to a PR, rerun all failed jobs in
# the latest CI run. This re-evaluates ``review-labels`` (which now sees the
# label) and GitHub reruns the dependent ``all-checks-pass`` gate.
#
# ``gh run rerun`` only works on a completed run. Thus this waits when the
# run is still in progress. The wait is now short. The two slowest jobs are
# the 40-minute comment poller and the 45-minute image build. Each one moved
# to its own workflow, so a CI run ends when its required jobs end.
#
# The review comment updates without help. The poller in
# ci-review-comment.yml watches the CI run through the API. It gets the
# rerun results.

on:
  pull_request:
    types: [labeled]

permissions:
  actions: write
  pull-requests: read

concurrency:
  group: label-rerun-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rerun-review-labels:
    name: Rerun review-labels job
    if: github.event.label.name == 'ci-reviewed'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait for CI run to finish, then rerun failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Keep the PR number in the environment rather than interpolating
          # event data into shell source. It is the authoritative PR to
          # query after an update-branch race.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          check_current_head() {
            CURRENT_HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
            if [ "$CURRENT_HEAD_SHA" != "$HEAD_SHA" ]; then
              echo "PR #$PR_NUMBER advanced from $HEAD_SHA to $CURRENT_HEAD_SHA; skipping stale CI rerun."
              exit 0
            fi
          }

          # A label can be added while the pull_request CI run is still being
          # queued. Wait briefly for the exact head-SHA run to become visible
          # instead of leaving an approved PR permanently blocked.
          RUN_INFO=""
          for attempt in $(seq 1 12); do
            RUN_INFO=$(gh run list \
              --repo "$REPO" \
              --commit "$HEAD_SHA" \
              --workflow ci.yaml \
              --limit 1 \
              --json databaseId,status,conclusion \
              --jq '.[0] | [.databaseId, .status, (.conclusion // "pending")] | @tsv')
            if [ -n "$RUN_INFO" ]; then
              break
            fi
            echo "CI run not visible yet (attempt $attempt/12); retrying in 10 seconds..."
            sleep 10
          done

          if [ -z "$RUN_INFO" ]; then
            echo "::error::No CI run found for PR head $HEAD_SHA; the approved review gate was not rerun."
            exit 1
          fi

          # The label event can be delivered after update-branch has already
          # moved the PR. Do not even wait on, or rerun, the stale run.
          check_current_head

          IFS=$'\t' read -r RUN_ID STATUS CONCLUSION <<< "$RUN_INFO"

          echo "Latest CI run: $RUN_ID (status: $STATUS, conclusion: ${CONCLUSION:-pending})"

          # If the run is still in progress, wait for it to finish.
          # gh run rerun only works on completed runs — if we try while it's
          # running, GitHub rejects with "cannot be rerun; This workflow is
          # already running".
          if [ "$STATUS" != "completed" ]; then
            echo "Run is $STATUS — waiting for completion (this may take a while)..."
            # gh run watch --exit-status exits non-zero if the run fails,
            # which is expected (the label gate fails). Don't let that kill
            # the workflow — we WANT to rerun failed jobs.
            timeout 2100 gh run watch "$RUN_ID" --repo "$REPO" --interval 15 || true

            # Verify it's actually completed now.
            IFS=$'\t' read -r STATUS CONCLUSION < <(
              gh run view "$RUN_ID" --repo "$REPO" \
                --json status,conclusion \
                --jq '[.status, (.conclusion // "pending")] | @tsv'
            )
            if [ "$STATUS" != "completed" ]; then
              echo "::error::CI run $RUN_ID is still $STATUS after the wait; the approved review gate was not rerun."
              exit 1
            fi
          fi

          if [ "$CONCLUSION" = "success" ]; then
            echo "CI run is already successful; no rerun is needed."
            exit 0
          fi

          # Re-read immediately before rerun as well. The PR can advance
          # while the old CI run is completing; this closes that TOCTOU race.
          check_current_head

          if [ "$CONCLUSION" = "failure" ]; then
            echo "Run completed with failures. Rerunning failed jobs..."
            gh run rerun "$RUN_ID" --repo "$REPO" --failed
          else
            echo "Run completed with conclusion ${CONCLUSION:-unknown}. Rerunning the full workflow..."
            gh run rerun "$RUN_ID" --repo "$REPO"
          fi
          echo "Done. GitHub will rerun review-labels and all dependent jobs."
